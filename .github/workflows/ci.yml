name: PressWarden CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name 'presswarden' \) -not -path './.git/*' | sort)

      - name: PHP helper syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file" >/dev/null
          done < <(find lib -type f -name '*.php' | sort)

      - name: Host-agnostic discovery smoke test
        shell: bash
        run: bash tests/smoke.sh

      - name: Threat-intel behavior regressions
        shell: bash
        run: bash tests/threat-intel-regressions.sh

      - name: Threat-intel credential safety
        shell: bash
        run: bash tests/intel-security.sh

      - name: Bounded-memory Wordfence streaming
        shell: bash
        run: bash tests/wordfence-stream.sh

      - name: No runtime process substitution
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '<[[:space:]]*<\(|>[[:space:]]*>\(' checks lib suites; then
            echo 'Runtime process substitution detected; shared-host portability regression.' >&2
            exit 1
          fi

      - name: No legacy branding
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'MKS SECURITY|mks_bash|\.config/mks' README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md docs checks lib suites config tests presswarden install.sh uninstall.sh; then
            echo 'Legacy MKS branding/path detected.' >&2
            exit 1
          fi

      - name: No hard-coded API token assignments
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(WPSCAN_API_TOKEN|HOSTINGER_API_TOKEN|PRESSWARDEN_WORDFENCE_TOKEN|PRESSWARDEN_PATCHSTACK_KEY)="[^"$][^"]+"' checks lib suites config intel presswarden install.sh --exclude-dir=.git; then
            echo 'Potential hard-coded API/token assignment detected.' >&2
            exit 1
          fi
