name: LiteSpeed DB quality

on:
  push:
    branches: [main]
    paths:
      - presswarden
      - checks/litespeed-db.sh
      - suites/db.sh
      - suites/full.sh
      - lib/litespeed-db-state.php
      - lib/run-continuation.php
      - tests/litespeed-db.sh
      - tests/run-continuation.sh
      - docs/LITESPEED-DATABASE.md
      - VERSION
      - CHANGELOG.md
      - .github/workflows/litespeed-db-quality.yml
  pull_request:
    branches: [main]
    paths:
      - presswarden
      - checks/litespeed-db.sh
      - suites/db.sh
      - suites/full.sh
      - lib/litespeed-db-state.php
      - lib/run-continuation.php
      - tests/litespeed-db.sh
      - tests/run-continuation.sh
      - docs/LITESPEED-DATABASE.md
      - VERSION
      - CHANGELOG.md
      - .github/workflows/litespeed-db-quality.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        shell: bash
        run: |
          bash -n presswarden checks/litespeed-db.sh suites/db.sh suites/full.sh tests/litespeed-db.sh tests/run-continuation.sh
          php -l lib/litespeed-db-state.php >/dev/null
          php -l lib/run-continuation.php >/dev/null

      - name: LiteSpeed DB verified behavior
        shell: bash
        run: bash tests/litespeed-db.sh

      - name: Interrupted maintenance continuation safety
        shell: bash
        run: bash tests/run-continuation.sh
