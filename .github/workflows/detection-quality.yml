name: Detection Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  precision:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cumulative pull request scope
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - name: Scoped JavaScript malicious and benign cases
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php -d memory_limit=32M tests/js-flow.php
      - name: Streaming JavaScript memory bound
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php -d memory_limit=32M tests/js-memory.php
      - name: Suite errors, skipped checks, and validator failures
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/runtime-reliability.sh
      - name: PHP 7.4 helper compatibility
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=32M tests/js-flow.php
      - name: Documentation-only scope
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'Runtime checks are not applicable to this cumulative documentation-only PR.'
  upstream:
    needs: precision
    if: ${{ !cancelled() && (needs.precision.result != 'success' || needs.precision.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Official packages and injected bundle controls
        run: bash tests/upstream-corpus.sh
