name: Detection Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scoped JavaScript malicious and benign cases
        run: php -d memory_limit=32M tests/js-flow.php
      - name: Streaming JavaScript memory bound
        run: php -d memory_limit=32M tests/js-memory.php
      - name: Suite errors, skipped checks, and validator failures
        run: bash tests/runtime-reliability.sh
      - name: PHP 7.4 helper compatibility
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=32M tests/js-flow.php
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Save unmodified official reference packages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/presswarden-reference"
          curl -fsSL --max-time 120 https://downloads.wordpress.org/plugin/elementor.4.2.4.zip -o "$RUNNER_TEMP/presswarden-reference/elementor.zip"
          curl -fsSL --max-time 120 https://downloads.wordpress.org/plugin/wordfence.9.0.0.zip -o "$RUNNER_TEMP/presswarden-reference/wordfence.zip"
          curl -fsSL --max-time 120 https://wordpress.org/wordpress-7.1.zip -o "$RUNNER_TEMP/presswarden-reference/wordpress.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: official-reference-packages
          path: ${{ runner.temp }}/presswarden-reference/*.zip
          retention-days: 1
          compression-level: 0
      - name: Official packages and injected bundle controls
        run: bash tests/upstream-corpus.sh
