name: Audit source snapshot
on:
  push:
    branches: [audit/public-readiness-20260924]
    paths: [.github/workflows/audit-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: marketania/PressWarden
          ref: 769bb727456b712d9d4577ca9b3c16cddef0d2b9
          path: PressWarden
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: marketania/PressHarden
          ref: 576370d863731c8d219283f11e76f7d4c00606b5
          path: PressHarden
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: marketania/PressGarden
          ref: 24ea24cc7ae567d23fd3cc91f9d91c4a789c3acb
          path: PressGarden
          persist-credentials: false
      - name: Export tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-source"
          for product in PressWarden PressHarden PressGarden; do
            git -C "$product" archive --format=tar.gz --prefix="$product/" HEAD > "$RUNNER_TEMP/audit-source/$product.tar.gz"
            git -C "$product" rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/audit-source/$product.provenance"
            git -C "$product" ls-files --stage > "$RUNNER_TEMP/audit-source/$product.inventory"
          done
          cd "$RUNNER_TEMP/audit-source"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: press-public-audit-source
          path: ${{ runner.temp }}/audit-source/
          retention-days: 7
          if-no-files-found: error
