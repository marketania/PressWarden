name: Stage Config Transactions 1.1.18
on:
  push:
    branches: [hardening/config-transactions-1.1.18]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/config-transactions-1.1.18
      - name: Apply caller and fixture integration
        run: |
          set -euo pipefail
          # Remove one overly exact test-tail replacement from the staging helper;
          # the two equivalent edits are applied directly below.
          sed -i 's/exit 94 ;;;/exit 94 ;;/g;82,84d' tests/.stage-config-transactions-1.1.18.py
          python3 tests/.stage-config-transactions-1.1.18.py
          sed -i '/find "$T\/state\/quarantine" -type f | grep -q ./i find "$T/state/config-transactions" -name wp-config.php | grep -q .' tests/wp-auto-updates.sh
          sed -i 's/targeting and backups PASS/targeting and transactional core backups PASS/' tests/wp-auto-updates.sh
      - name: Validate transactional mutations
        run: |
          set -euo pipefail
          git diff --check
          bash -n lib/config-transaction.sh checks/file-mods.sh checks/wp-settings.sh checks/wp-auto-updates.sh tests/config-transaction.sh tests/site-lock.sh tests/wp-settings.sh tests/wp-auto-updates.sh
          php -l lib/config-transaction.php >/dev/null
          bash tests/config-transaction.sh
          bash tests/site-lock.sh
          bash tests/wp-settings.sh
          bash tests/wp-auto-updates.sh
          bash tests/runtime-reliability.sh
          bash tests/run-continuation.sh
          bash tests/smoke.sh
      - name: PHP 7.4 compatibility
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/config-transaction.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/config-transaction.sh
      - name: Commit tested production integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checks/wp-settings.sh checks/wp-auto-updates.sh tests/site-lock.sh tests/wp-settings.sh tests/wp-auto-updates.sh README.md CHANGELOG.md VERSION
          git commit -m 'refactor: route wp-config mutations through verified transactions'
          git push origin HEAD:hardening/config-transactions-1.1.18
