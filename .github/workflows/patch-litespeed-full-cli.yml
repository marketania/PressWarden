name: Wire Full LiteSpeed CLI

on:
  push:
    branches: [feature/litespeed-full-cli]
    paths:
      - .github/workflows/patch-litespeed-full-cli.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/litespeed-full-cli

      - name: Patch CLI, version and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('presswarden')
          text = p.read_text()
          usage_anchor = "  ./presswarden litespeed-db optimize [target]  Run LiteSpeed Cache optimize_all cleanup\n"
          usage_add = usage_anchor + "  ./presswarden litespeed AREA ACTION ... --target SITE  Full LiteSpeed Cache CLI management\n"
          if usage_anchor not in text:
              raise SystemExit('usage anchor not found')
          if 'Full LiteSpeed Cache CLI management' not in text:
              text = text.replace(usage_anchor, usage_add, 1)

          dispatch_anchor = '''  litespeed-db)\n    action="${1:-status}"; [ "$#" -gt 0 ] && shift || true\n'''
          if dispatch_anchor not in text:
              raise SystemExit('dispatch anchor not found')
          dispatch = '''  litespeed)\n    ls_target=''\n    ls_args=()\n    while [ "$#" -gt 0 ]; do\n      case "$1" in\n        --target|--site)\n          [ "$#" -ge 2 ] || { printf '%s requires a website, directory, or all.\\n' "$1" >&2; exit 2; }\n          ls_target="$2"; shift 2 ;;\n        --target=*|--site=*)\n          ls_target=${1#*=}; [ -n "$ls_target" ] || { printf 'LiteSpeed target cannot be empty.\\n' >&2; exit 2; }; shift ;;\n        *) ls_args+=("$1"); shift ;;\n      esac\n    done\n    if [ -n "$ls_target" ]; then select_target "$ls_target" || exit 2; else select_target || exit 2; fi\n    exec bash "$PRESSWARDEN_DIR/checks/litespeed.sh" "${ls_args[@]}"\n    ;;\n'''
          if '\n  litespeed)\n' not in text:
              text = text.replace(dispatch_anchor, dispatch + dispatch_anchor, 1)
          p.write_text(text)

          version = Path('VERSION')
          cur = version.read_text().strip()
          if cur not in {'1.1.20', '1.1.21'}:
              raise SystemExit(f'unexpected VERSION {cur}')
          version.write_text('1.1.21\n')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          if '## 1.1.21 — 2026-09-15' not in c:
              anchor = 'All notable changes to PressWarden are documented here.\n\n'
              if anchor not in c:
                  raise SystemExit('changelog anchor missing')
              entry = '''## 1.1.21 — 2026-09-15\n\nComplete LiteSpeed Cache WP-CLI management.\n\n- Add `litespeed` as a guarded umbrella interface covering every LiteSpeed Cache command family documented by LiteSpeed: options, purge, presets, image optimization, QUIC.cloud online services, debug/support reports, crawler control and database optimization.\n- Preserve normal PressWarden website/fleet targeting through explicit `--target` / `--site`, with sequential per-site execution, active-plugin/bootstrap preflight, missing-command errors and the existing `litespeed-db` compatibility command.\n- Add settings get/all/set/export/import/remote-import/reset with private per-site exports, pre-change backups for configuration mutations and default redaction of secret-like option/output fields.\n- Add all cache purge scopes, preset apply/backup-list/restore, all image optimization actions, QUIC.cloud status/services/nodes/ping/init/link/CDN activation, debug environment-report upload, all crawler actions and all six LiteSpeed database maintenance actions including multisite blog IDs.\n- Keep QUIC.cloud API/Cloudflare tokens out of ordinary shell-history arguments by supporting environment-variable references. Guard irreversible original-image backup removal and non-interactive support-report upload with additional explicit opt-ins.\n- Preserve LiteSpeed's special database CLI rule by invoking `litespeed-database` from the WordPress directory without normal WP-CLI global parameters. Add comprehensive regression coverage and operator documentation.\n\n'''
              c = c.replace(anchor, anchor + entry, 1)
              changelog.write_text(c)
          PY
          bash -n presswarden checks/litespeed.sh tests/litespeed-full-cli.sh
          grep -q 'Full LiteSpeed Cache CLI management' presswarden
          grep -qx '1.1.21' VERSION

      - name: Commit and remove one-time patch workflow
        shell: bash
        run: |
          git config user.name 'PressWarden automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-litespeed-full-cli.yml
          git add presswarden VERSION CHANGELOG.md
          git commit -m 'Wire full LiteSpeed CLI management'
          git push origin HEAD:feature/litespeed-full-cli
