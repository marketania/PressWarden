name: Progress Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  terminal:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cumulative pull request scope
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - name: Optional progress without a terminal
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php tests/progress.php
      - name: Real terminal rendering, safe counts and report isolation
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: python3 tests/progress-terminal.py
      - name: Recursive filesystem progress and traversal failures
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: python3 tests/filesystem-progress.py
      - name: Existing PHP, JS and database failure contracts
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: |
          bash tests/php-intel-runtime.sh
          bash tests/runtime-reliability.sh
          bash tests/db-runtime.sh
      - name: PHP 7.4 progress compatibility
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php tests/progress.php
      - name: Documentation-only scope
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'Runtime checks are not applicable to this cumulative documentation-only PR.'
