name: Stage Resilient Run State
on:
  push:
    branches: [feature/resilient-run-state-1.1.16]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resilient-run-state-1.1.16
      - name: Apply staged integration
        run: python3 tests/.stage-run-state-1.1.16.py
      - name: Validate focused run-state regressions
        run: |
          set -euo pipefail
          git diff --check
          bash -n presswarden lib/_runner.sh lib/run-state.sh tests/run-state.sh
          php -l lib/run-state.php >/dev/null
          bash tests/run-state.sh
          bash tests/runtime-reliability.sh
          bash tests/suite-progress.sh
          python3 tests/progress-terminal.py
          bash tests/smoke.sh
      - name: PHP 7.4 run-state compatibility
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/run-state.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/run-state.sh
      - name: Commit tested production changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/run-state.php lib/run-state.sh lib/_runner.sh presswarden tests/run-state.sh docs/RUN-STATE.md VERSION CHANGELOG.md README.md
          git commit -m 'feat: resilient suite run state and interruption tracking'
          git push origin HEAD:feature/resilient-run-state-1.1.16
