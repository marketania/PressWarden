name: LiteSpeed Full CLI Quality

on:
  pull_request:
    branches: [main]
    paths:
      - presswarden
      - checks/litespeed.sh
      - checks/litespeed-db.sh
      - tests/litespeed-full-cli.sh
      - docs/LITESPEED.md
      - VERSION
      - CHANGELOG.md
      - .github/workflows/litespeed-full-quality.yml
  push:
    branches: [main]
    paths:
      - presswarden
      - checks/litespeed.sh
      - checks/litespeed-db.sh
      - tests/litespeed-full-cli.sh
      - docs/LITESPEED.md
      - VERSION
      - CHANGELOG.md
      - .github/workflows/litespeed-full-quality.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: bash -n presswarden checks/litespeed.sh checks/litespeed-db.sh tests/litespeed-full-cli.sh

      - name: Full LiteSpeed CLI behavior
        shell: bash
        run: bash tests/litespeed-full-cli.sh

      - name: Documented family coverage
        shell: bash
        run: |
          set -euo pipefail
          for family in option purge presets image online debug crawler database; do
            grep -q "${family}" checks/litespeed.sh
          done
