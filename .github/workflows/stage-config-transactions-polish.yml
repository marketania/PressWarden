name: Stage Config Transaction Polish
on:
  push:
    branches: [hardening/config-transactions-1.1.18]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/config-transactions-1.1.18
      - name: Apply ownership and temp-file hardening
        run: python3 tests/.stage-config-transactions-polish.py
      - name: Validate hardening
        run: |
          set -euo pipefail
          git diff --check
          php -l lib/config-transaction.php >/dev/null
          bash tests/config-transaction.sh
          bash tests/site-lock.sh
          bash tests/wp-settings.sh
          bash tests/wp-auto-updates.sh
          bash tests/run-continuation.sh
          bash tests/runtime-reliability.sh
      - name: PHP 7.4 compatibility
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/config-transaction.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/config-transaction.sh
      - name: Commit tested hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/config-transaction.php tests/config-transaction.sh docs/CONFIG-TRANSACTIONS.md CHANGELOG.md
          git commit -m 'fix: preserve wp-config ownership across atomic publication'
          git push origin HEAD:hardening/config-transactions-1.1.18
