name: Stage Auto Updates
on:
  push:
    branches: [quality/auto-updates-progress-1.1.11]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/auto-updates-progress-1.1.11
      - name: Apply reviewed changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              assert old in s, f'missing marker in {path}: {old[:80]!r}'
              s=s.replace(old,new,count)
              p.write_text(s)

          rep('VERSION','1.1.10\n','1.1.11\n')

          for path in ['suites/fast.sh','suites/full.sh']:
              p=Path(path); s=p.read_text()
              assert ' wp-access wp-core ' in s
              p.write_text(s.replace(' wp-access wp-core ',' wp-access wp-auto-updates wp-core ',1))

          rep('lib/_runner.sh',
              '  local c rc n out seen="" start elapsed force="" total_checks=0 current_check=0 check_path\n',
              '  local c rc n out seen="" start elapsed force="" total_checks=0 current_check=0 check_path completed_before suite_percent\n')
          rep('lib/_runner.sh',
              '    seen="$seen $c"; current_check=$((current_check+1)); check_path="$PRESSWARDEN_DIR/checks/$c.sh"\n',
              '    seen="$seen $c"; current_check=$((current_check+1)); check_path="$PRESSWARDEN_DIR/checks/$c.sh"\n'
              '    completed_before=$((current_check-1)); suite_percent=$((completed_before*100/total_checks))\n'
              '    export PW_SUITE_CURRENT="$current_check" PW_SUITE_TOTAL="$total_checks" PW_SUITE_COMPLETED="$completed_before" PW_SUITE_PERCENT="$suite_percent"\n')
          rep('lib/_runner.sh',
              "      printf '\\n%s%s▶ SKIP%s %s[%s/%s]%s  %s%s%s  %s(administrator checks skipped)%s\\n' \"$B\" \"$Y\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$D\" \"$X\"\n",
              "      printf '\\n%s%s▶ SKIP%s %s[%s/%s]%s  %s%s%s  %s(administrator checks skipped • suite %s%% complete)%s\\n' \"$B\" \"$Y\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$D\" \"$suite_percent\" \"$X\"\n")
          rep('lib/_runner.sh',
              "      printf '\\n%s%s▶ SKIP%s %s[%s/%s]%s  %s%s%s  %s(slow image-content scan skipped)%s\\n' \"$B\" \"$Y\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$D\" \"$X\"\n",
              "      printf '\\n%s%s▶ SKIP%s %s[%s/%s]%s  %s%s%s  %s(slow image-content scan skipped • suite %s%% complete)%s\\n' \"$B\" \"$Y\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$D\" \"$suite_percent\" \"$X\"\n")
          rep('lib/_runner.sh',
              "      printf '\\n%s%s▶ RUN%s  %s[%s/%s]%s  %s%s%s  %s(missing/unreadable)%s\\n' \"$B\" \"$BL\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$Y\" \"$X\"\n",
              "      printf '\\n%s%s▶ RUN%s  %s[%s/%s]%s  %s%s%s  %s(missing/unreadable • suite %s%% complete)%s\\n' \"$B\" \"$BL\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$Y\" \"$suite_percent\" \"$X\"\n")
          rep('lib/_runner.sh',
              "    printf '\\n%s%s▶ RUN%s  %s[%s/%s]%s  %s%s%s\\n' \"$B\" \"$BL\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\"\n",
              "    printf '\\n%s%s▶ RUN%s  %s[%s/%s]%s  %s%s%s  %s(suite %s%% complete)%s\\n' \"$B\" \"$BL\" \"$X\" \"$B\" \"$current_check\" \"$total_checks\" \"$X\" \"$B\" \"$c\" \"$X\" \"$D\" \"$suite_percent\" \"$X\"\n")

          rep('lib/ui.sh',
              "  printf '  %s%-11s%s %s%s%s\\n' \"$D\" \"CHECK\" \"$X\" \"$B\" \"$NAME\" \"$X\"\n",
              "  printf '  %s%-11s%s %s%s%s\\n' \"$D\" \"CHECK\" \"$X\" \"$B\" \"$NAME\" \"$X\"\n"
              "  if [ -n \"${PW_SUITE_TOTAL:-}\" ]; then _meta_field 11 \"PROGRESS\" \"${PW_SUITE_PERCENT:-0}% suite complete • step ${PW_SUITE_CURRENT:-?}/${PW_SUITE_TOTAL}\"; fi\n")

          rep('presswarden',
              '  ./presswarden lock-status [target]   Show DISALLOW_FILE_MODS status across discovered sites\n  ./presswarden file-mods ACTION [target]  Legacy/advanced status|on|off interface\n',
              '  ./presswarden lock-status [target]   Show DISALLOW_FILE_MODS status across discovered sites\n'
              '  ./presswarden auto-updates status [target]  Show core/plugin/theme auto-update policy\n'
              '  ./presswarden auto-updates core minor|major|disabled [target]\n'
              '  ./presswarden auto-updates plugins enable|disable [target]\n'
              '  ./presswarden auto-updates themes enable|disable [target]\n'
              '  ./presswarden file-mods ACTION [target]  Legacy/advanced status|on|off interface\n')
          rep('presswarden',
              'Examples: ./presswarden scan example.com   ./presswarden lock example.com   ./presswarden unlock all\n',
              'Examples: ./presswarden scan example.com   ./presswarden lock example.com   ./presswarden auto-updates core minor example.com\n')

          marker='cmd="${1:-help}"; shift || true\n'
          confirm=r'''confirm_auto_update_change() {
  local area="$1" value="$2" root="$3" ans=''
  if [ "${PRESSWARDEN_INTERACTIVE:-1}" = "0" ]; then return 0; fi
  if [ -r /dev/tty ] && [ -w /dev/tty ]; then
    if [ -n "${TARGET_NAME:-}" ]; then
      printf '\n  Set %s auto-updates to %s for %s (%s installation(s))? [y/N]: ' "$area" "$value" "$TARGET_NAME" "${TARGET_COUNT:-1}" > /dev/tty
    else
      printf '\n  Set %s auto-updates to %s for all discovered websites under %s? [y/N]: ' "$area" "$value" "$root" > /dev/tty
    fi
    IFS= read -r ans < /dev/tty || ans=''
    case "$ans" in y|Y|yes|YES) return 0 ;; *) printf 'Cancelled.\n'; return 1 ;; esac
  fi
  printf 'Refusing fleet auto-update change without an interactive terminal. Set PRESSWARDEN_INTERACTIVE=0 to run intentionally in automation.\n' >&2
  return 1
}

'''
          rep('presswarden',marker,confirm+marker)

          auto_case=r'''  auto-updates)
    area="${1:-status}"; [ "$#" -gt 0 ] && shift || true
    case "$area" in
      status)
        [ "$#" -le 1 ] || { printf 'Usage: ./presswarden auto-updates status [website|directory|all]\n' >&2; exit 2; }
        select_target "$@" || exit 2
        exec bash "$PRESSWARDEN_DIR/checks/wp-auto-updates.sh" status
        ;;
      core)
        value="${1:-}"; [ "$#" -gt 0 ] && shift || true
        case "$value" in minor|major|disabled) : ;; disable) value=disabled ;; *) printf 'Core policy must be minor, major, or disabled.\n' >&2; exit 2 ;; esac
        [ "$#" -le 1 ] || { printf 'Usage: ./presswarden auto-updates core minor|major|disabled [website|directory|all]\n' >&2; exit 2; }
        select_target "$@" || exit 2
        confirm_auto_update_change CORE "$value" "$ROOT" || exit 1
        export PRESSWARDEN_INTERACTIVE=0
        exec bash "$PRESSWARDEN_DIR/checks/wp-auto-updates.sh" core "$value"
        ;;
      plugins|themes)
        value="${1:-}"; [ "$#" -gt 0 ] && shift || true
        case "$value" in enable|disable) : ;; *) printf '%s policy must be enable or disable.\n' "$area" >&2; exit 2 ;; esac
        [ "$#" -le 1 ] || { printf 'Usage: ./presswarden auto-updates %s enable|disable [website|directory|all]\n' "$area" >&2; exit 2; }
        select_target "$@" || exit 2
        confirm_auto_update_change "${area^^}" "$value" "$ROOT" || exit 1
        export PRESSWARDEN_INTERACTIVE=0
        exec bash "$PRESSWARDEN_DIR/checks/wp-auto-updates.sh" "$area" "$value"
        ;;
      *) printf 'Use auto-updates status, core, plugins, or themes.\n' >&2; exit 2 ;;
    esac
    ;;
'''
          rep('presswarden','  file-mods)\n',auto_case+'  file-mods)\n')

          check=r'''#!/usr/bin/env bash
NAME=wp-auto-updates; DESC="WordPress core, plugin, and theme automatic-update policy"
SCAN_DOES="Reports configured core auto-update level plus plugin/theme auto-update coverage, and identifies global blockers without changing site state."
SCAN_WHY="Automatic-update policy affects how quickly WordPress receives maintenance and security fixes; visibility helps operators make deliberate fleet-wide choices."
. "$(cd "$(dirname "$0")/.." && pwd)/lib/_lib.sh"

ACTION="${1:-status}"; VALUE="${2:-}"

_wpcmd() { local site="$1"; shift; wp "$@" --path="$site" "${WPQ[@]}"; }
_cfg_has() { _wpcmd "$1" config has "$2" --type=constant >/dev/null 2>&1; }
_cfg_json() { _wpcmd "$1" config get "$2" --type=constant --format=json 2>/dev/null; }
_cfg_true() { _cfg_has "$1" "$2" && _wpcmd "$1" config is-true "$2" --type=constant >/dev/null 2>&1; }

_core_policy() {
  local site="$1" v major minor
  if _cfg_has "$site" WP_AUTO_UPDATE_CORE; then
    v=$(_cfg_json "$site" WP_AUTO_UPDATE_CORE) || return 2
    case "$v" in
      true) printf 'MAJOR' ;;
      false) printf 'DISABLED' ;;
      '"minor"') printf 'MINOR' ;;
      '"beta"'|'"rc"'|'"development"'|'"branch-development"') printf 'MAJOR' ;;
      *) printf 'CUSTOM' ;;
    esac
    return 0
  fi
  major=$(_wpcmd "$site" option get auto_update_core_major --format=json 2>/dev/null || printf '"unset"')
  minor=$(_wpcmd "$site" option get auto_update_core_minor --format=json 2>/dev/null || printf '"enabled"')
  case "$major" in '"enabled"') printf 'MAJOR'; return 0 ;; esac
  case "$minor" in '"disabled"') printf 'DISABLED' ;; *) printf 'MINOR' ;; esac
}

_item_counts() {
  local site="$1" type="$2" total enabled
  total=$(_wpcmd "$site" "$type" auto-updates status --all --format=count 2>/dev/null) || return 2
  enabled=$(_wpcmd "$site" "$type" auto-updates status --all --enabled-only --format=count 2>/dev/null) || return 2
  case "$total:$enabled" in *[!0-9:]*|:*|*:) return 2 ;; esac
  printf '%s\t%s\n' "$total" "$enabled"
}

_item_state() {
  local total="$1" enabled="$2"
  if [ "$total" -eq 0 ]; then printf 'N/A'
  elif [ "$enabled" -eq 0 ]; then printf 'DISABLED'
  elif [ "$enabled" -eq "$total" ]; then printf 'ENABLED'
  else printf 'PARTIAL'
  fi
}

_blocker() {
  local site="$1" out=''
  _cfg_true "$site" AUTOMATIC_UPDATER_DISABLED && out='AUTOMATIC_UPDATER_DISABLED'
  if _cfg_true "$site" DISALLOW_FILE_MODS; then
    [ -z "$out" ] || out+=','
    out+='DISALLOW_FILE_MODS'
  fi
  printf '%s' "$out"
}

_status_row() {
  local site="$1" label core pc tc pt pe tt te ps ts block
  label=$(site_label_from_root "$site")
  core=$(_core_policy "$site") || return 2
  pc=$(_item_counts "$site" plugin) || return 2; IFS=$'\t' read -r pt pe <<< "$pc"
  tc=$(_item_counts "$site" theme) || return 2; IFS=$'\t' read -r tt te <<< "$tc"
  ps=$(_item_state "$pt" "$pe"); ts=$(_item_state "$tt" "$te"); block=$(_blocker "$site")
  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$label" "$core" "$ps" "$pe" "$pt" "$ts" "$te" "$tt" "$block"
}

_save_status_details() {
  local rows="$1"
  [ -n "${DETAIL_LOG:-}" ] || return 0
  {
    printf '\n[AUTO-UPDATES] per-site configured policy\n'
    printf 'site\tcore\tplugins\tplugins_enabled\tplugins_total\tthemes\tthemes_enabled\tthemes_total\tglobal_blocker\n'
    cat "$rows"
  } >> "$DETAIL_LOG" || return 1
}

_status() {
  local rows site failed=0 n label core ps pe pt ts te tt block
  local minor=0 major=0 disabled=0 custom=0 p_on=0 p_partial=0 p_off=0 p_na=0 t_on=0 t_partial=0 t_off=0 t_na=0 blocked=0
  require_wp; discover_sites; banner
  sec "WordPress automatic-update policy" "core • plugins • themes • global blockers"
  rows=$(tmpf); : > "$rows"
  for site in "${WP_SITES[@]}"; do
    if ! _status_row "$site" >> "$rows"; then
      printf '    INCOMPLETE: %s auto-update policy could not be read.\n' "$(site_label_from_root "$site")" >&2
      failed=1
    fi
  done
  [ "$failed" -eq 0 ] || { rm -f "$rows"; return 2; }
  _save_status_details "$rows" || { rm -f "$rows"; printf '    INCOMPLETE: auto-update detail evidence could not be saved.\n' >&2; return 2; }
  n=$(grep -c . "$rows" 2>/dev/null); n=${n:-0}
  if [ "$n" -le 3 ]; then
    while IFS=$'\t' read -r label core ps pe pt ts te tt block; do
      printf '    %s✓%s  %s%s%s  Core %s%s%s • Plugins %s %s/%s • Themes %s %s/%s' "$G" "$X" "$B$M" "$label" "$X" "$B" "$core" "$X" "$ps" "$pe" "$pt" "$ts" "$te" "$tt"
      [ -z "$block" ] || printf ' • %sBLOCKED by %s%s' "$Y" "$block" "$X"
      printf '\n'
    done < "$rows"
  else
    while IFS=$'\t' read -r label core ps pe pt ts te tt block; do
      case "$core" in MINOR) minor=$((minor+1));; MAJOR) major=$((major+1));; DISABLED) disabled=$((disabled+1));; *) custom=$((custom+1));; esac
      case "$ps" in ENABLED) p_on=$((p_on+1));; PARTIAL) p_partial=$((p_partial+1));; DISABLED) p_off=$((p_off+1));; *) p_na=$((p_na+1));; esac
      case "$ts" in ENABLED) t_on=$((t_on+1));; PARTIAL) t_partial=$((t_partial+1));; DISABLED) t_off=$((t_off+1));; *) t_na=$((t_na+1));; esac
      [ -z "$block" ] || blocked=$((blocked+1))
    done < "$rows"
    printf '    %s✓ CORE%s     MINOR %s • MAJOR %s • DISABLED %s • CUSTOM %s\n' "$G" "$X" "$minor" "$major" "$disabled" "$custom"
    printf '    %sℹ PLUGINS%s  ENABLED %s • PARTIAL %s • DISABLED %s • N/A %s\n' "$C" "$X" "$p_on" "$p_partial" "$p_off" "$p_na"
    printf '    %sℹ THEMES%s   ENABLED %s • PARTIAL %s • DISABLED %s • N/A %s\n' "$C" "$X" "$t_on" "$t_partial" "$t_off" "$t_na"
    [ "$blocked" -eq 0 ] || printf '    %sℹ BLOCKED%s  %s/%s site(s) have a global updater blocker; use auto-updates status <site> for detail\n' "$Y" "$X" "$blocked" "$n"
  fi
  note "Core policy uses WP_AUTO_UPDATE_CORE when explicitly defined; plugin/theme counts reflect installed-item preferences. Global blockers are reported separately."
  rm -f "$rows"
  finish
}

_backup_config() {
  local site="$1" label="$2" root="$3" dest
  dest="$root/$label/wp-config.php"
  mkdir -p "$(dirname "$dest")" 2>/dev/null || return 1
  cp -p "$site/wp-config.php" "$dest" 2>/dev/null || return 1
  chmod 600 "$dest" 2>/dev/null || true
  printf '%s' "$dest"
}

_set_core() {
  local site label backup_root backup desired now block fail=0
  require_wp; discover_sites
  backup_root="$QUARANTINE/auto-updates-core-$(date -u +%Y%m%dT%H%M%SZ)-$$"; mkdir -p "$backup_root" || return 2; chmod 700 "$backup_root" 2>/dev/null || true
  for site in "${WP_SITES[@]}"; do
    label=$(site_label_from_root "$site"); backup=$(_backup_config "$site" "$label" "$backup_root") || { printf '✖ %s: could not back up wp-config.php\n' "$label"; fail=1; continue; }
    case "$VALUE" in
      minor) _wpcmd "$site" config set WP_AUTO_UPDATE_CORE minor --type=constant >/dev/null 2>&1; rc=$?; desired=MINOR ;;
      major) _wpcmd "$site" config set WP_AUTO_UPDATE_CORE true --raw --type=constant >/dev/null 2>&1; rc=$?; desired=MAJOR ;;
      disabled) _wpcmd "$site" config set WP_AUTO_UPDATE_CORE false --raw --type=constant >/dev/null 2>&1; rc=$?; desired=DISABLED ;;
    esac
    if [ "${rc:-2}" -ne 0 ]; then cp -p "$backup" "$site/wp-config.php" 2>/dev/null || true; printf '✖ %s: core policy update failed; wp-config.php restored\n' "$label"; fail=1; continue; fi
    now=$(_core_policy "$site" 2>/dev/null || true)
    if [ "$now" != "$desired" ]; then cp -p "$backup" "$site/wp-config.php" 2>/dev/null || true; printf '✖ %s: verification failed; wp-config.php restored\n' "$label"; fail=1; continue; fi
    block=$(_blocker "$site")
    printf '✓ %s: core auto-updates %s' "$label" "$desired"; [ -z "$block" ] || printf ' (configured, but blocked by %s)' "$block"; printf '\n'
  done
  [ "$fail" -eq 0 ] || return 2
}

_enabled_names() { _wpcmd "$1" "$2" auto-updates status --all --enabled-only --field=name 2>/dev/null; }
_restore_items() {
  local site="$1" type="$2" saved="$3" name
  _wpcmd "$site" "$type" auto-updates disable --all >/dev/null 2>&1 || return 1
  while IFS= read -r name; do [ -n "$name" ] || continue; _wpcmd "$site" "$type" auto-updates enable "$name" >/dev/null 2>&1 || return 1; done < "$saved"
}

_set_items() {
  local type singular site label root saved counts total enabled want fail=0 block
  case "$ACTION" in plugins) type=plugin; singular=Plugins ;; themes) type=theme; singular=Themes ;; esac
  require_wp; discover_sites
  root="$QUARANTINE/auto-updates-${type}-$(date -u +%Y%m%dT%H%M%SZ)-$$"; mkdir -p "$root" || return 2; chmod 700 "$root" 2>/dev/null || true
  for site in "${WP_SITES[@]}"; do
    label=$(site_label_from_root "$site"); saved="$root/$label-enabled.txt"; mkdir -p "$(dirname "$saved")" || { fail=1; continue; }
    _enabled_names "$site" "$type" > "$saved" || { printf '✖ %s: could not snapshot %s auto-update preferences\n' "$label" "${singular,,}"; fail=1; continue; }; chmod 600 "$saved" 2>/dev/null || true
    _wpcmd "$site" "$type" auto-updates "$VALUE" --all >/dev/null 2>&1 || { _restore_items "$site" "$type" "$saved" >/dev/null 2>&1 || true; printf '✖ %s: %s auto-update change failed; previous preference list restored where possible\n' "$label" "$singular"; fail=1; continue; }
    counts=$(_item_counts "$site" "$type" 2>/dev/null) || { _restore_items "$site" "$type" "$saved" >/dev/null 2>&1 || true; printf '✖ %s: %s verification failed; previous preference list restored where possible\n' "$label" "$singular"; fail=1; continue; }
    IFS=$'\t' read -r total enabled <<< "$counts"
    want=0; [ "$VALUE" = enable ] && want=$total
    if [ "$enabled" -ne "$want" ]; then _restore_items "$site" "$type" "$saved" >/dev/null 2>&1 || true; printf '✖ %s: %s verification mismatch; previous preference list restored where possible\n' "$label" "$singular"; fail=1; continue; fi
    block=$(_blocker "$site")
    printf '✓ %s: %s auto-updates %s (%s/%s enabled)' "$label" "$singular" "${VALUE^^}D" "$enabled" "$total"; [ -z "$block" ] || printf ' (configured, but blocked by %s)' "$block"; printf '\n'
  done
  [ "$fail" -eq 0 ] || return 2
}

main() {
  case "$ACTION" in
    status) _status ;;
    core) _set_core ;;
    plugins|themes) _set_items ;;
    *) printf 'Unknown auto-update action.\n' >&2; return 2 ;;
  esac
}

if [ "$ACTION" = status ]; then run_logged wp-auto-updates; else main; fi
'''
          Path('checks/wp-auto-updates.sh').write_text(check)

          docs=r'''# WordPress automatic-update policy

PressWarden can inspect and deliberately set WordPress core, plugin, and theme auto-update preferences using the same website-name targeting as scan and lock/unlock.

```bash
./presswarden auto-updates status example.com
./presswarden auto-updates status all

./presswarden auto-updates core minor example.com
./presswarden auto-updates core major example.com
./presswarden auto-updates core disabled example.com

./presswarden auto-updates plugins enable example.com
./presswarden auto-updates plugins disable all
./presswarden auto-updates themes enable example.com
./presswarden auto-updates themes disable all
```

`core minor` writes `WP_AUTO_UPDATE_CORE='minor'`; `major` writes `true`; `disabled` writes `false`. The constant overrides the normal core auto-update choice in wp-admin. PressWarden does not change `AUTOMATIC_UPDATER_DISABLED` or `DISALLOW_FILE_MODS` when setting a policy. If either blocks the automatic updater, status and set commands say the preference is configured but blocked.

Plugin/theme enable and disable use the WordPress/WP-CLI per-item auto-update preference for all installed items in the selected installation. Status reports ENABLED when all installed items are enabled, DISABLED when none are enabled, PARTIAL when only some are enabled, and N/A when none are installed. These preferences can still be overridden by WordPress filters or emergency-update responses; PressWarden reports the stored preference and known global config blockers, not a proof that a future update will execute.

Core changes back up `wp-config.php` before editing and verify the resulting policy. Plugin/theme changes save the previously enabled item list privately, verify the new count, and attempt to restore the prior list if the operation or verification fails. No command automatically unlocks file modifications or removes a global updater blocker.

The read-only `wp-auto-updates` check is part of Fast and Full. Fleet scans use compact counts rather than printing every site; per-site state is retained in the private detail report. A one-site `auto-updates status example.com` prints the exact core/plugin/theme state directly. The check is informational and does not create a security finding solely because an operator chose minor, major, disabled, enabled, partial, or disabled plugin/theme updates.

Core semantics follow WordPress: `WP_AUTO_UPDATE_CORE=true` enables development/minor/major core updates, `false` disables them, and `'minor'` enables minor updates only. WordPress can also disable the entire background updater when file modifications are disallowed or `AUTOMATIC_UPDATER_DISABLED` is true.
'''
          Path('docs/AUTO-UPDATES.md').write_text(docs)

          test=r'''#!/usr/bin/env bash
set -euo pipefail
REPO=$(cd "$(dirname "$0")/.." && pwd)
T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
mkdir -p "$T/bin"
for name in example.com other.com; do
  p="$T/sites/$name/public_html"; mkdir -p "$p/wp-admin" "$p/wp-content" "$p/wp-includes"
  touch "$p/wp-load.php" "$p/wp-settings.php"; printf '<?php $wp_version="7.1";\n' > "$p/wp-includes/version.php"
  printf '<?php define("WP_AUTO_UPDATE_CORE", "minor");\n' > "$p/wp-config.php"
  printf 'minor\n' > "$p/.core"; printf '4\n' > "$p/.plugins-total"; printf '2\n' > "$p/.plugins-enabled"; printf '3\n' > "$p/.themes-total"; printf '0\n' > "$p/.themes-enabled"
done
cat > "$T/bin/wp" <<'WP'
#!/usr/bin/env bash
set -eu
p=''; args=(); for a in "$@"; do case "$a" in --path=*) p=${a#--path=} ;; --skip-*|--no-color) ;; *) args+=("$a") ;; esac; done
set -- "${args[@]}"; [ -n "$p" ] || exit 90
case "$1" in
 config)
   case "$2" in
    has) case "$3" in WP_AUTO_UPDATE_CORE) exit 0 ;; AUTOMATIC_UPDATER_DISABLED|DISALLOW_FILE_MODS) [ -f "$p/.${3}" ] ;; *) exit 1 ;; esac ;;
    get) case "$3" in WP_AUTO_UPDATE_CORE) case "$(cat "$p/.core")" in minor) echo '"minor"';; major) echo true;; disabled) echo false;; esac ;; *) exit 1;; esac ;;
    is-true) [ -f "$p/.${3}" ] ;;
    set) case "$3" in WP_AUTO_UPDATE_CORE) case "$4" in minor) echo minor > "$p/.core"; printf '<?php define("WP_AUTO_UPDATE_CORE", "minor");\n' > "$p/wp-config.php" ;; true) echo major > "$p/.core"; printf '<?php define("WP_AUTO_UPDATE_CORE", true);\n' > "$p/wp-config.php" ;; false) echo disabled > "$p/.core"; printf '<?php define("WP_AUTO_UPDATE_CORE", false);\n' > "$p/wp-config.php" ;; esac ;; esac ;;
   esac ;;
