   type=$1; total=$(cat "$p/.${type}s-total"); enabled=$(cat "$p/.${type}s-enabled")
   [ "$2" = auto-updates ] || exit 91
   case "$3" in
    status)
      case " $* " in *' --field=name '*) i=1; while [ "$i" -le "$enabled" ]; do echo "$type$i"; i=$((i+1)); done ;; *' --enabled-only '*) echo "$enabled" ;; *) echo "$total" ;; esac ;;
