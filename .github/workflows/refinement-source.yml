name: Refinement source snapshot
on:
  push:
    branches: [audit/refinement-source-20260928]
    paths: [.github/workflows/refinement-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressWarden
          ref: d7867965a9b9d759568ef1a2503e394b4baa8e99
          path: PressWarden
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressGarden
          ref: b1a78ece9e0cef83b2721ae5dc0464f164b0b165
          path: PressGarden
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressHarden
          ref: aa7817961f5cfc8b06d8beef8d7051040f059616
          path: PressHarden
          persist-credentials: false
      - name: Export tracked public sources only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refinement-source"
          for product in PressWarden PressGarden PressHarden; do
            git -C "$product" archive --format=tar.gz --prefix="$product/" HEAD > "$RUNNER_TEMP/refinement-source/$product.tar.gz"
            git -C "$product" rev-parse HEAD > "$RUNNER_TEMP/refinement-source/$product.commit"
            git -C "$product" rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/refinement-source/$product.tree"
          done
          cd "$RUNNER_TEMP/refinement-source"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: press-refinement-source
          path: ${{ runner.temp }}/refinement-source/
          retention-days: 7
          if-no-files-found: error
