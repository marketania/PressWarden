name: Verify approved artwork transfer
on:
  push:
    branches: [audit/public-readiness-20260924]
    paths:
      - .github/workflows/audit-art.yml
      - .github/audit-staging/art-*.b64
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/public-readiness-20260924
      - name: Reconstruct only checksum-matching approved artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/audit-staging/verify-art.py
      - name: Commit verified image only
        run: |
          set -euo pipefail
          git config user.name 'Press family audit'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/assets/press-tool-family.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add checksum-verified approved Press family artwork'
            git push origin HEAD:audit/public-readiness-20260924
          fi
