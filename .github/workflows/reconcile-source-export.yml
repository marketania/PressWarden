name: Reconcile main source
on:
  push:
    branches: [fix/litespeed-maintenance-1.1.22]
    paths: [.github/workflows/reconcile-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3abee36f7879dbd5dc41701a6d6826bd70189c24
      - run: git archive --format=tar HEAD > /tmp/presswarden-main.tar
      - uses: actions/upload-artifact@v4
        with:
          name: presswarden-concurrent-main
          path: /tmp/presswarden-main.tar
          retention-days: 1
