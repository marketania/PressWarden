name: Apply verified maintenance repair
on:
  push:
    branches: [fix/litespeed-maintenance-1.1.22]
    paths: [.github/workflows/apply-maintenance-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/litespeed-maintenance-1.1.22
          fetch-depth: 0
      - name: Verify and apply tested patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          paths = sorted(Path('.').glob('.pw-repair-??.b64'))
          assert [p.name for p in paths] == ['.pw-repair-%02d.b64' % i for i in range(9)]
          pieces = [p.read_text().strip() for p in paths]
          # Correct a single known transport transcription; final SHA pins every source byte.
          if len(pieces[7]) == 4001:
              assert pieces[7].count('QTXrxJJJKMNnTJ5') == 1
              pieces[7] = pieces[7].replace('QTXrxJJJKMNnTJ5', 'QTXrxJJKMNnTJ5')
          assert all(len(p) == 4000 for p in pieces[:8]) and len(pieces[8]) == 2196
          patch = gzip.decompress(base64.b64decode(''.join(pieces), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'feda09873a3a32967fb6c47879bb475b89d05ea8b97879ec59210cf46a576441'
          Path('/tmp/maintenance-repair.patch').write_bytes(patch)
          PY
          git apply --check /tmp/maintenance-repair.patch
          git apply --index /tmp/maintenance-repair.patch
          git rm .pw-repair-??.b64 .maintenance-repair.01.b64
          git diff --cached --check
          php tests/db-maintenance.php
          bash tests/db-maintenance-runtime.sh
          bash tests/litespeed-db.sh
          bash tests/litespeed-full-cli.sh
          bash tests/smoke.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate LiteSpeed database maintenance and correct command contracts'
          git push origin HEAD:fix/litespeed-maintenance-1.1.22
