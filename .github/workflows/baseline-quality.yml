name: Baseline Quality
on:
  push:
    branches: [quality/baseline-coverage-1.1.8]
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source snapshot for isolated local validation
        run: git archive --format=tar HEAD -o /tmp/presswarden-baseline-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: presswarden-baseline-source
          path: /tmp/presswarden-baseline-source.tar
          retention-days: 1
