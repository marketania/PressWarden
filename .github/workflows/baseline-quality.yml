name: Baseline Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded runs of the same pull request. Main and manual runs get a
# unique group so every exact-commit run finishes for the release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  coverage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict inert inventory CSV
        run: php -d memory_limit=64M tests/baseline-csv.php
      - name: Lost coverage, scope, legacy and state preservation
        run: bash tests/baseline-coverage.sh
      - name: Concurrent baselines, activation recovery and interruption
        run: bash tests/baseline-transactions.sh
      - name: Existing baseline, incident and fleet behavior
        run: bash tests/baseline.sh && bash tests/incident.sh && bash tests/fleet-correlate.sh
      - name: PHP 7.4 inventory compatibility
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=64M tests/baseline-csv.php
