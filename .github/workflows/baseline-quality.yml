name: Baseline Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  coverage:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cumulative pull request scope
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - name: Strict inert inventory CSV
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php -d memory_limit=64M tests/baseline-csv.php
      - name: Lost coverage, scope, legacy and state preservation
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/baseline-coverage.sh
      - name: Concurrent baselines, activation recovery and interruption
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/baseline-transactions.sh
      - name: Existing baseline, incident and fleet behavior
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/baseline.sh && bash tests/incident.sh && bash tests/fleet-correlate.sh
      - name: PHP 7.4 inventory compatibility
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=64M tests/baseline-csv.php
      - name: Documentation-only scope
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'Runtime checks are not applicable to this cumulative documentation-only PR.'
