name: Update Quality
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing preservation regressions
        run: bash tests/update.sh
      - name: Source snapshot for isolated regression development
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/presswarden-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: presswarden-source-snapshot
          path: ${{ runner.temp }}/presswarden-source.tar.gz
          retention-days: 1
