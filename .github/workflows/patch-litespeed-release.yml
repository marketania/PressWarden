name: Prepare LiteSpeed DB release metadata

on:
  push:
    branches: [feature/litespeed-db-maintenance]
    paths:
      - .github/workflows/patch-litespeed-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/litespeed-db-maintenance

      - name: Update version and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION')
          current = version.read_text().strip()
          if current not in {'1.1.19', '1.1.20'}:
              raise SystemExit(f'unexpected VERSION: {current}')
          version.write_text('1.1.20\n')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## 1.1.20 — 2026-09-15' not in text:
              anchor = 'All notable changes to PressWarden are documented here.\n\n'
              if anchor not in text:
                  raise SystemExit('changelog anchor not found')
              entry = '''## 1.1.20 — 2026-09-15\n\nExplicit LiteSpeed Cache database cleanup maintenance.\n\n- Add `litespeed-db status|optimize [target]` with normal PressWarden website, directory and fleet targeting while keeping LiteSpeed cleanup separate from security scans and native SQL database maintenance.\n- Preflight WordPress bootstrap, LiteSpeed Cache installation/activation and command availability so unavailable sites cannot be misreported as successful skips. Interactive mutation requires confirmation; intentional automation uses the existing `PRESSWARDEN_INTERACTIVE=0` convention.\n- Run `wp litespeed-database optimize_all` sequentially from each eligible WordPress installation directory without appending WP-CLI global parameters, matching LiteSpeed's documented exception for the `litespeed-database` command family.\n- Warn instead of claiming network-wide cleanup for WordPress multisite when no explicit `blog <id>` is supplied. Preserve existing core/plugin/theme update policy behavior.\n- Add focused regressions for exact CLI invocation, targeting, bootstrap/command failures, runtime failures and multisite warnings, plus operator documentation and a weekly cron example.\n\n'''
              text = text.replace(anchor, anchor + entry, 1)
              changelog.write_text(text)
          PY
          grep -qx '1.1.20' VERSION
          grep -q '^## 1.1.20 — 2026-09-15$' CHANGELOG.md

      - name: Commit metadata and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'PressWarden automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-litespeed-release.yml
          git add VERSION CHANGELOG.md
          git commit -m 'Document LiteSpeed database maintenance release'
          git push origin HEAD:feature/litespeed-db-maintenance
