name: PHP Detection Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded runs of the same pull request. Main and manual runs get a
# unique group so every exact-commit run finishes for the release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  precision:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scoped PHP malicious and benign cases
        run: php -d memory_limit=64M tests/php-flow.php
      - name: PHP memory and resource boundaries
        run: php -d memory_limit=64M tests/php-memory.php
      - name: Read-only evidence, privacy, cache and scan failures
        run: bash tests/php-intel-runtime.sh
      - name: PHP 7.4 compatibility
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=64M tests/php-flow.php
  upstream:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Official PHP packages and injected controls
        run: bash tests/php-upstream.sh
