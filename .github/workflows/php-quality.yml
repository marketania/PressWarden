name: PHP Detection Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  precision:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cumulative pull request scope
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - name: Scoped PHP malicious and benign cases
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php -d memory_limit=64M tests/php-flow.php
      - name: PHP memory and resource boundaries
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php -d memory_limit=64M tests/php-memory.php
      - name: Read-only evidence, privacy, cache and scan failures
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/php-intel-runtime.sh
      - name: PHP 7.4 compatibility
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=64M tests/php-flow.php
      - name: Documentation-only scope
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'Runtime checks are not applicable to this cumulative documentation-only PR.'
  upstream:
    needs: precision
    if: ${{ !cancelled() && (needs.precision.result != 'success' || needs.precision.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Official PHP packages and injected controls
        run: bash tests/php-upstream.sh
