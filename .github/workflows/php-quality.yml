name: PHP Detection Quality
on:
  push:
    branches: [quality/php-evidence-1.1.4]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/presswarden-php-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: presswarden-php-source
          path: /tmp/presswarden-php-source.tar
          retention-days: 1
