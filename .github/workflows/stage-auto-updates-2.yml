name: Stage Auto Updates 2
on:
  push:
    branches: [quality/auto-updates-progress-1.1.11]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/auto-updates-progress-1.1.11
      - name: Reconstruct and apply reviewed staging script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/stage-auto-updates.yml').read_text()
          start="python3 - <<'PY'\n"
          assert start in src
          block=src.split(start,1)[1]
          end='\n          PY\n'
          assert end in block
          block=block.split(end,1)[0]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '):
                  line=line[10:]
              lines.append(line)
          code='\n'.join(lines)+'\n'
          compile(code,'stage-auto-updates.py','exec')
          exec(compile(code,'stage-auto-updates.py','exec'),{'__name__':'__main__'})
          # The reconstructed script removes the original invalid staging workflow.
          Path('.github/workflows/stage-auto-updates-2.yml').unlink()
          PY
          chmod +x checks/wp-auto-updates.sh tests/wp-auto-updates.sh tests/suite-progress.sh
      - name: Validate staged source
        run: |
          bash tests/wp-auto-updates.sh
          bash tests/suite-progress.sh
          bash -n presswarden lib/_runner.sh lib/ui.sh checks/wp-auto-updates.sh suites/fast.sh suites/full.sh
          bash tests/smoke.sh
      - name: Commit source changes to review branch
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: WordPress auto-update policy controls and suite progress'
          git push origin HEAD:refs/heads/quality/auto-updates-progress-1.1.11
