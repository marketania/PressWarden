name: Stage Auto Updates 2
on:
  push:
    branches: [quality/auto-updates-progress-1.1.11]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/auto-updates-progress-1.1.11
      - name: Fix blocker row and extend regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('checks/wp-auto-updates.sh'); s=p.read_text()
          old="  printf '%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\n' \"$label\" \"$core\" \"$ps\" \"$pe\" \"$pt\" \"$ts\" \"$te\" \"$tt\" \"$block\"\n"
          new="  printf '%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\t%s\\n' \"$label\" \"$core\" \"$ps\" \"$pe\" \"$pt\" \"$ts\" \"$te\" \"$tt\" \"$block\"\n"
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('  local site label backup_root backup desired now block fail=0\n','  local site label backup_root backup desired now block rc fail=0\n',1)
          p.write_text(s)
          p=Path('tests/wp-auto-updates.sh'); s=p.read_text()
          marker='done\ncat > "$T/bin/wp" <<\'WP\'\n'
          assert marker in s
          s=s.replace(marker,'done\ntouch "$T/sites/other.com/public_html/.DISALLOW_FILE_MODS"\ncat > "$T/bin/wp" <<\'WP\'\n',1)
          marker2="run auto-updates status example.com > \"$T/status\"\ngrep -q 'Core .*MINOR' \"$T/status\"; grep -q 'Plugins PARTIAL 2/4' \"$T/status\"; grep -q 'Themes DISABLED 0/3' \"$T/status\"\n"
          assert marker2 in s
          s=s.replace(marker2,marker2+"run auto-updates status other.com > \"$T/blocked\"\ngrep -q 'BLOCKED by DISALLOW_FILE_MODS' \"$T/blocked\"\n",1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          bash tests/wp-auto-updates.sh
          bash tests/suite-progress.sh
          bash -n checks/wp-auto-updates.sh tests/wp-auto-updates.sh
      - name: Commit source fix only
        run: |
          git add checks/wp-auto-updates.sh tests/wp-auto-updates.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve blocker field in auto-update status'
          git push origin HEAD:refs/heads/quality/auto-updates-progress-1.1.11
