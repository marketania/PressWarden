name: Report Quality
on:
  push:
    branches: [quality/report-preservation-1.1.6]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only for isolated regression development
        run: git archive --format=tar HEAD -o /tmp/presswarden-report-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: presswarden-report-source
          path: /tmp/presswarden-report-source.tar
          retention-days: 1
