name: Stage README Version
on:
  push:
    branches: [fix/quarantine-confirm-race-1.1.15]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quarantine-confirm-race-1.1.15
      - run: |
          set -euo pipefail
          sed -i 's/version-1\.1\.14-2ea44f/version-1.1.15-2ea44f/' README.md
          grep -q 'version-1.1.15-2ea44f' README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update version badge to 1.1.15'
          git push origin HEAD:fix/quarantine-confirm-race-1.1.15
