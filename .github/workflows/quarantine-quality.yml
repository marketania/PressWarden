name: Quarantine Quality
on:
  push:
    branches: [quality/verified-quarantine-1.1.7]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture tracked source for isolated tests
        run: git archive --format=tar.gz HEAD > /tmp/presswarden-quarantine-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: presswarden-quarantine-source
          path: /tmp/presswarden-quarantine-source.tar.gz
          retention-days: 1
