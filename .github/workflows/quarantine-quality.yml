name: Quarantine Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  safety:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cumulative pull request scope
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - name: Verified copies, changed originals, boundaries and partial failures
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: php -d memory_limit=64M tests/quarantine.php
      - name: Approved actions, read-only inspection, privacy and concurrency
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/quarantine-runtime.sh
      - name: Manual retention preview, verification gate and exact approval
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/quarantine-prune.sh
      - name: Interruption before and after source removal
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: bash tests/quarantine-interruption.sh
      - name: PHP 7.4 quarantine compatibility
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli php -d memory_limit=64M tests/quarantine.php
      - name: Documentation-only scope
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: echo 'Runtime checks are not applicable to this cumulative documentation-only PR.'
