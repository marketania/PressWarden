name: Apply LiteSpeed fleet CLI 1.1.24

on:
  push:
    branches: [fix/litespeed-fleet-cli-1.1.24]
    paths:
      - .github/workflows/one-shot-litespeed-fleet-cli-1.1.24.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/litespeed-fleet-cli-1.1.24
          fetch-depth: 0

      - name: Apply reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-litespeed-fleet-cli-1.1.24.py

      - name: Debug focused behavior
        shell: bash
        run: |
          set -uo pipefail
          set +e
          git diff --check
          drc=$?
          [ "$drc" -eq 0 ] || exit "$drc"
          bash -n presswarden checks/litespeed.sh checks/litespeed-db.sh tests/litespeed-db.sh tests/litespeed-full-cli.sh
          drc=$?
          [ "$drc" -eq 0 ] || exit "$drc"
          cp tests/litespeed-db.sh /tmp/litespeed-db-test.orig
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/litespeed-db.sh')
          s=p.read_text()
          s=s.replace("T=$(mktemp -d); trap 'rm -rf \"$T\"' EXIT", "T=$(mktemp -d); trap 'echo DEBUG_KEEP=$T' EXIT", 1)
          p.write_text(s)
          PY
          bash -x tests/litespeed-db.sh
          rc=$?
          echo "DEBUG_TEST_RC=$rc"
          find /tmp -maxdepth 2 -type f \( -name status -o -name fleet-optimize -o -name bad-target \) -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          mv /tmp/litespeed-db-test.orig tests/litespeed-db.sh
          exit "$rc"

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes were produced." >&2; exit 1; }
          git commit -m "Fix LiteSpeed fleet execution and CLI guidance"
          git push origin HEAD:fix/litespeed-fleet-cli-1.1.24
