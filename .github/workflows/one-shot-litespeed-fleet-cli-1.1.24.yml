name: Apply LiteSpeed fleet CLI 1.1.24

on:
  push:
    branches: [fix/litespeed-fleet-cli-1.1.24]
    paths:
      - .github/workflows/one-shot-litespeed-fleet-cli-1.1.24.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/litespeed-fleet-cli-1.1.24
          fetch-depth: 0

      - name: Apply reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-litespeed-fleet-cli-1.1.24.py')
          s = p.read_text(encoding='utf-8')
          old = 'replace_section("checks/litespeed-db.sh", "_optimize() {\\n", "case \\\"$ACTION\\\" in\\n", new_optimize)'
          new = 'replace_section("checks/litespeed-db.sh", "\\n_optimize() {\\n", "case \\\"$ACTION\\\" in\\n", "\\n" + new_optimize)'
          if s.count(old) != 1:
              raise SystemExit('optimize function boundary patch target not unique')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/apply-litespeed-fleet-cli-1.1.24.py

      - name: Validate focused behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n presswarden checks/litespeed.sh checks/litespeed-db.sh tests/litespeed-db.sh tests/litespeed-full-cli.sh
          bash tests/litespeed-db.sh
          bash tests/litespeed-full-cli.sh
          bash tests/smoke.sh

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes were produced." >&2; exit 1; }
          git commit -m "Fix LiteSpeed fleet execution and CLI guidance"
          git push origin HEAD:fix/litespeed-fleet-cli-1.1.24
