name: Stage Safe Continue
on:
  push:
    branches: [feature/safe-continue-1.1.17]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safe-continue-1.1.17
      - name: Apply continuation integration
        run: |
          python3 tests/.stage-safe-continue-1.1.17.py
          python3 tests/.stage-safe-continue-fixture.py
          python3 tests/.stage-safe-continue-fixes.py
      - name: Validate focused and existing regressions
        run: |
          set -euo pipefail
          git diff --check
          bash -n presswarden lib/_runner.sh lib/run-state.sh lib/run-continuation.sh tests/run-continuation.sh tests/runtime-reliability.sh
          php -l lib/run-state.php >/dev/null
          php -l lib/run-continuation.php >/dev/null
          php -l lib/suite-summary.php >/dev/null
          bash -x tests/run-continuation.sh
          bash tests/run-state.sh
          bash tests/runtime-reliability.sh
          bash tests/suite-progress.sh
          python3 tests/progress-terminal.py
          bash tests/report-preservation.sh
          bash tests/smoke.sh
      - name: PHP 7.4 compatibility
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/run-continuation.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/suite-summary.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/run-continuation.sh
      - name: Commit tested release candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/run-continuation.php lib/run-continuation.sh lib/_runner.sh lib/suite-summary.php presswarden tests/run-continuation.sh tests/runtime-reliability.sh .github/workflows/run-state-quality.yml docs/CONTINUATION.md VERSION CHANGELOG.md README.md
          git commit -m 'feat: safely continue interrupted suite scans'
          git push origin HEAD:feature/safe-continue-1.1.17
