name: Stage Quarantine Diagnostics
on:
  push:
    branches: [fix/quarantine-confirm-race-1.1.15]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quarantine-confirm-race-1.1.15
      - name: Apply staged source changes
        run: python3 tests/.stage-quarantine-diagnostics.py
      - name: Validate quarantine regressions
        run: |
          set -euo pipefail
          git diff --check
          bash -n lib/quarantine.sh lib/remediation.sh tests/quarantine-runtime.sh
          php -l lib/quarantine.php >/dev/null
          php -l lib/quarantine-cli.php >/dev/null
          bash tests/quarantine-runtime.sh
          php tests/quarantine.php
          bash tests/quarantine-interruption.sh
      - name: Commit tested source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/quarantine.php lib/quarantine-cli.php lib/quarantine.sh lib/remediation.sh tests/quarantine-runtime.sh VERSION CHANGELOG.md
          git commit -m 'fix: clarify quarantine stale-selection refusal'
          git push origin HEAD:fix/quarantine-confirm-race-1.1.15
