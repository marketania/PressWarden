name: Run State Quality
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
# Cancel superseded runs of the same pull request. Main and manual runs get a
# unique group so every exact-commit run finishes for the release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resilience:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run-state interruption, continuation, locking and privacy
        run: |
          set -euo pipefail
          bash -n presswarden lib/_runner.sh lib/run-state.sh lib/run-continuation.sh tests/run-state.sh tests/run-continuation.sh tests/runtime-reliability.sh
          php -l lib/run-state.php >/dev/null
          php -l lib/run-continuation.php >/dev/null
          bash tests/run-state.sh
          bash tests/run-continuation.sh
          bash tests/runtime-reliability.sh
          bash tests/suite-progress.sh
      - name: PHP 7.4 compatibility
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/run-state.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/run-continuation.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/run-state.sh
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/run-continuation.sh
