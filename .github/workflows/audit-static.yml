name: Audit static diagnostics
on:
  push:
    branches: [audit/public-readiness-20260924]
    paths: [.github/workflows/audit-static.yml]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: PressWarden
            ref: 769bb727456b712d9d4577ca9b3c16cddef0d2b9
          - product: PressHarden
            ref: 576370d863731c8d219283f11e76f7d4c00606b5
          - product: PressGarden
            ref: 24ea24cc7ae567d23fd3cc91f9d91c4a789c3acb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marketania/${{ matrix.product }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Inspect shell error diagnostics without executing applications
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          program=$(tr '[:upper:]' '[:lower:]' < PRODUCT)
          shellcheck --severity=error --shell=bash --format=gcc "$program" "${files[@]}"
