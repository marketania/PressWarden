name: Stage Discovery Completeness
on:
  push:
    branches: [reliability/discovery-completeness-1.1.14]
    paths: [.github/workflows/stage-discovery-completeness.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/discovery-completeness-1.1.14
      - name: Apply discovery reliability changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Harden discovery cache loading/saving and rebuild derived fields from validated roots.
          p = Path('lib/env-discovery.sh')
          s = p.read_text()
          a = s.index('_discovery_cache_key()')
          b = s.rindex('\nrefresh_scan_roots')
          block = r'''_discovery_cache_key() { printf '%s\n' "$ROOT|$PRESSWARDEN_DISCOVERY_DEPTH|$PRESSWARDEN_EXCLUDE|$PRESSWARDEN_VERSION|${_PW_TARGET_EXCLUSIONS:-}" | cksum | awk '{print $1":"$2}'; }
          _discovery_text_safe() {
            local v="$1"
            [ -n "$v" ] || return 1
            [[ "$v" != *[[:cntrl:]]* ]]
          }
          _discovery_path_safe() {
            local p="$1" rr pr
            _discovery_text_safe "$p" || return 1
            case "$p" in "$ROOT"|"$ROOT"/*) ;; *) return 1 ;; esac
            if command -v realpath >/dev/null 2>&1; then
              rr=$(realpath "$ROOT" 2>/dev/null) || return 1
              pr=$(realpath "$p" 2>/dev/null) || return 1
              case "$pr" in "$rr"|"$rr"/*) ;; *) return 1 ;; esac
            fi
            return 0
          }
          _discovery_rebuild_derived() {
            local p label group parent nested
            TREE_ROOTS=(); DISCOVERED_DOMAINS=(); NESTED_SITES=(); MANUAL_EXCLUDED_DOMAINS=()
            for p in "${MANUAL_EXCLUDED_ROOTS[@]}"; do
              label=$(site_label_from_root "$p"); _discovery_text_safe "$label" || return 1
              _array_has "$label" "${MANUAL_EXCLUDED_DOMAINS[@]}" || MANUAL_EXCLUDED_DOMAINS+=("$label")
            done
            for p in "${SCAN_ROOTS[@]}"; do
              label=$(site_label_from_root "$p"); _discovery_text_safe "$label" || return 1
              group=${label%%/*}; _discovery_text_safe "$group" || return 1
              _array_has "$group" "${DISCOVERED_DOMAINS[@]}" || DISCOVERED_DOMAINS+=("$group")
              nested=0
              for parent in "${TREE_ROOTS[@]}"; do case "$p" in "$parent"/*) nested=1; break ;; esac; done
              if [ "$nested" -eq 1 ]; then NESTED_SITES+=("$label"); else TREE_ROOTS+=("$p"); fi
            done
            return 0
          }
          _load_discovery_cache() {
            local ttl="${PRESSWARDEN_DISCOVERY_CACHE_TTL:-300}" cache="$PRESSWARDEN_CACHE_DIR/discovery.tsv" now mt age key type val extra p size lines first=1
            case "$ttl" in ''|*[!0-9]*) ttl=300 ;; esac
            [ "$ttl" -gt 0 ] || return 1
            [ "${PRESSWARDEN_DISCOVERY_REFRESH:-0}" != "1" ] || return 1
            [ -f "$cache" ] && [ ! -L "$cache" ] || return 1
            size=$(wc -c < "$cache" 2>/dev/null | tr -d '[:space:]') || return 1
            lines=$(wc -l < "$cache" 2>/dev/null | tr -d '[:space:]') || return 1
            case "$size:$lines" in *[!0-9:]*|:*|*:) return 1 ;; esac
            [ "$size" -gt 0 ] && [ "$size" -le 4194304 ] && [ "$lines" -le 50000 ] || return 1
            now=$(date +%s); mt=$(stat -c %Y "$cache" 2>/dev/null || printf '0')
            case "$mt" in ''|*[!0-9]*) return 1 ;; esac
            age=$((now-mt)); [ "$age" -ge 0 ] && [ "$age" -le "$ttl" ] || return 1
            key=$(_discovery_cache_key)
            SCAN_ROOTS=(); TREE_ROOTS=(); IGNORED_DOMAINS=(); MANUAL_EXCLUDED_DOMAINS=(); MANUAL_EXCLUDED_ROOTS=(); DISCOVERED_DOMAINS=(); NESTED_SITES=()
            while IFS=$'\t' read -r type val extra || [ -n "$type$val$extra" ]; do
              if [ "$first" -eq 1 ]; then
                [ "$type" = META ] && [ "$val" = "$key" ] && [ -z "$extra" ] || return 1
                first=0; continue
              fi
              [ -z "$extra" ] || return 1
              case "$type" in
                ROOT)
                  _discovery_path_safe "$val" || return 1
                  _is_wordpress_root "$val" || return 1
                  _is_excluded_site "$val" && return 1
                  _array_has "$val" "${SCAN_ROOTS[@]}" || SCAN_ROOTS+=("$val")
                  [ "${#SCAN_ROOTS[@]}" -le 5000 ] || return 1
                  ;;
                EXCLUDED_ROOT)
                  _discovery_path_safe "$val" || return 1
                  _array_has "$val" "${MANUAL_EXCLUDED_ROOTS[@]}" || MANUAL_EXCLUDED_ROOTS+=("$val")
                  ;;
                TREE) _discovery_path_safe "$val" || return 1 ;;
                EXCLUDED_LABEL|DOMAIN|NESTED) _discovery_text_safe "$val" || return 1 ;;
                META|'') return 1 ;;
                *) return 1 ;;
              esac
            done < "$cache"
            [ "$first" -eq 0 ] && [ "${#SCAN_ROOTS[@]}" -gt 0 ] || return 1
            _discovery_rebuild_derived || return 1
            return 0
          }
          _save_discovery_cache() {
            local cache="$PRESSWARDEN_CACHE_DIR/discovery.tsv" tmp key x
            mkdir -p "$PRESSWARDEN_CACHE_DIR" 2>/dev/null || return 0
            if [ -e "$cache" ] || [ -L "$cache" ]; then [ -f "$cache" ] && [ ! -L "$cache" ] || return 0; fi
            tmp=$( (umask 077; mktemp "$PRESSWARDEN_CACHE_DIR/.discovery.XXXXXX") ) || return 0
            key=$(_discovery_cache_key)
            {
              printf 'META\t%s\n' "$key"
              for x in "${SCAN_ROOTS[@]}"; do printf 'ROOT\t%s\n' "$x"; done
              for x in "${TREE_ROOTS[@]}"; do printf 'TREE\t%s\n' "$x"; done
              for x in "${MANUAL_EXCLUDED_DOMAINS[@]}"; do printf 'EXCLUDED_LABEL\t%s\n' "$x"; done
              for x in "${MANUAL_EXCLUDED_ROOTS[@]}"; do printf 'EXCLUDED_ROOT\t%s\n' "$x"; done
              for x in "${DISCOVERED_DOMAINS[@]}"; do printf 'DOMAIN\t%s\n' "$x"; done
              for x in "${NESTED_SITES[@]}"; do printf 'NESTED\t%s\n' "$x"; done
            } > "$tmp" || { rm -f "$tmp"; return 0; }
            chmod 600 "$tmp" 2>/dev/null || true
            mv -f "$tmp" "$cache" 2>/dev/null || rm -f "$tmp"
          }
          refresh_scan_roots() { _load_discovery_cache && { PW_DISCOVERY_FAILED=0; return 0; }; _refresh_scan_roots_uncached; [ "${PW_DISCOVERY_FAILED:-0}" -ne 0 ] || _save_discovery_cache; return 0; }
          '''
          p.write_text(s[:a] + block + s[b:])

          # Surface incomplete discovery early in every check banner.
          p = Path('lib/ui.sh'); s = p.read_text()
          old = '''  printf '  %s%-11s%s %s%s%s WordPress install(s) across %s site group(s)\\n' "$D" "SITES" "$X" "$B" "$(count_sites)" "$X" "$(count_domains)"\n'''
          new = old + '''  [ "${PW_DISCOVERY_FAILED:-0}" -eq 0 ] || _meta_field 11 "COVERAGE" "INCOMPLETE discovery: validated sites are shown, but one or more paths could not be fully inspected."\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Make direct check summaries and run_logged fail closed on incomplete discovery.
          p = Path('lib/remediation.sh'); s = p.read_text()
          s = s.replace('''  if [ "${PW_REPORT_FAILED:-0}" -ne 0 ] || [ "${PW_REMEDIATION_FAILED:-0}" -ne 0 ]; then col="$Y"; status='INCOMPLETE'\n''', '''  if [ "${PW_REPORT_FAILED:-0}" -ne 0 ] || [ "${PW_REMEDIATION_FAILED:-0}" -ne 0 ] || [ "${PW_DISCOVERY_FAILED:-0}" -ne 0 ]; then col="$Y"; status='INCOMPLETE'\n''', 1)
          old = '''  if [ "${PW_REMEDIATION_FAILED:-0}" -ne 0 ]; then\n    printf '  Partial removal is possible; deleted counts only completed targets. Inspect the retained quarantine case.\\n'\n  fi\n  _rule\n  printf '\\n'\n  [ "${PW_REPORT_FAILED:-0}" -eq 0 ] && [ "${PW_REMEDIATION_FAILED:-0}" -eq 0 ] || return 2\n'''
          new = '''  if [ "${PW_REMEDIATION_FAILED:-0}" -ne 0 ]; then\n    printf '  Partial removal is possible; deleted counts only completed targets. Inspect the retained quarantine case.\\n'\n  fi\n  if [ "${PW_DISCOVERY_FAILED:-0}" -ne 0 ]; then\n    printf '  Discovery coverage is INCOMPLETE; results above cover validated sites only.\\n'\n  fi\n  _rule\n  printf '\\n'\n  [ "${PW_REPORT_FAILED:-0}" -eq 0 ] && [ "${PW_REMEDIATION_FAILED:-0}" -eq 0 ] && [ "${PW_DISCOVERY_FAILED:-0}" -eq 0 ] || return 2\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  if [ "${log_status[1]}" -ne 0 ]; then\n    printf 'INCOMPLETE: console report could not be written completely.\\n' >&2\n    rc=2\n  fi\n  pw_report_remove_empty\n'''
          new = '''  if [ "${log_status[1]}" -ne 0 ]; then\n    printf 'INCOMPLETE: console report could not be written completely.\\n' >&2\n    rc=2\n  fi\n  if [ "${PW_DISCOVERY_FAILED:-0}" -ne 0 ] && [ "$rc" -lt 2 ]; then\n    printf 'INCOMPLETE: WordPress discovery was incomplete; validated-site results are retained.\\n' | tee -a "$LOG" >&2 || true\n    rc=2\n  fi\n  pw_report_remove_empty\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Make suite preflight/final verdict discovery-aware while continuing useful checks.
          p = Path('lib/_runner.sh'); s = p.read_text()
          old = '''. "$(dirname "${BASH_SOURCE[0]}")/_lib.sh"\n# Refresh discovery once per suite; children reuse the validated snapshot.\n'''
          new = '''. "$(dirname "${BASH_SOURCE[0]}")/_lib.sh"\nSUITE_DISCOVERY_INCOMPLETE="${PW_DISCOVERY_FAILED:-0}"\n# Refresh discovery once per suite; children reuse the validated snapshot when available.\n'''
          assert old in s; s = s.replace(old, new, 1)
          old = '''  local c rc n out seen="" start elapsed force="" total_checks=0 current_check=0 check_path completed_before suite_percent\n'''
          new = '''  local c rc n out seen="" start elapsed force="" total_checks=0 current_check=0 check_path completed_before suite_percent discovery_incomplete="${SUITE_DISCOVERY_INCOMPLETE:-0}"\n'''
          assert old in s; s = s.replace(old, new, 1)
          old = '''  printf '  %s%-10s%s %s%s%s WordPress install(s) across %s site group(s)\\n' "$D" "SITES" "$X" "$B" "$(count_sites)" "$X" "$(count_domains)"\n'''
          new = old + '''  [ "$discovery_incomplete" -eq 0 ] || _meta_field 10 "COVERAGE" "INCOMPLETE discovery: checks will continue on validated sites, but this suite cannot be ALL CLEAR."\n'''
          assert old in s; s = s.replace(old, new, 1)
          s = s.replace('''  if [ "$failed" -gt 0 ] || [ "$completed" -eq 0 ]; then\n''', '''  if [ "$failed" -gt 0 ] || [ "$completed" -eq 0 ] || [ "$discovery_incomplete" -ne 0 ]; then\n''', 1)
          old = '''  printf '  %sindividual reports:%s %s\\n\\n' "$D" "$X" "$REPORTS"\n  [ "$failed" -eq 0 ] && [ "$completed" -gt 0 ] || return 2\n'''
          new = '''  [ "$discovery_incomplete" -eq 0 ] || printf '  Discovery coverage is INCOMPLETE; successful check results above are retained for validated sites.\\n'\n  printf '  %sindividual reports:%s %s\\n\\n' "$D" "$X" "$REPORTS"\n  [ "$failed" -eq 0 ] && [ "$completed" -gt 0 ] && [ "$discovery_incomplete" -eq 0 ] || return 2\n'''
          assert old in s; s = s.replace(old, new, 1)
          old = '''    if ! php "$PRESSWARDEN_DIR/lib/suite-summary.php" "$RES" "$json" "$NAME" "$PRESSWARDEN_VERSION" "$ROOT" "$(count_sites)" "$(count_domains)" "$rc" "$LOG"; then\n'''
          new = '''    if ! php "$PRESSWARDEN_DIR/lib/suite-summary.php" "$RES" "$json" "$NAME" "$PRESSWARDEN_VERSION" "$ROOT" "$(count_sites)" "$(count_domains)" "$rc" "$LOG" "${SUITE_DISCOVERY_INCOMPLETE:-0}"; then\n'''
          assert old in s; s = s.replace(old, new, 1)
          p.write_text(s)

          # Add additive discovery_status to suite JSON.
          p = Path('lib/suite-summary.php'); s = p.read_text()
          s = s.replace('''if ($argc !== 10) { fwrite(STDERR, "Invalid suite summary arguments\\n"); exit(2); }\n[$res, $out, $suite, $version, $root, $sites, $domains, $rc, $log] = array_slice($argv, 1);\n''', '''if ($argc !== 11) { fwrite(STDERR, "Invalid suite summary arguments\\n"); exit(2); }\n[$res, $out, $suite, $version, $root, $sites, $domains, $rc, $log, $discovery] = array_slice($argv, 1);\n$discoveryIncomplete = $discovery === '1';\n''', 1)
          s = s.replace('''$coverage = ((int)$rc > 1 || $failed > 0 || $completed === 0) ? 'incomplete' : ($skipped > 0 ? 'partial' : 'complete');\n''', '''$coverage = ((int)$rc > 1 || $failed > 0 || $completed === 0 || $discoveryIncomplete) ? 'incomplete' : ($skipped > 0 ? 'partial' : 'complete');\n''', 1)
          s = s.replace("'''run_id'=>basename($log, '.log'), 'console_log'=>$log, 'checks'=>$checks];'''", "'''run_id'=>basename($log, '.log'), 'console_log'=>$log, 'discovery_status'=>$discoveryIncomplete ? 'incomplete' : 'complete', 'checks'=>$checks];'''", 1)
          p.write_text(s)

          # Extend synthetic suite regression with discovery incompleteness.
          p = Path('tests/runtime-reliability.sh'); s = p.read_text()
          old = '''SCAN_ROOTS=("$ROOT"); NESTED_SITES=(); MANUAL_EXCLUDED_DOMAINS=()\n'''
          new = old + '''PW_DISCOVERY_FAILED="${PW_TEST_DISCOVERY_FAILED:-0}"\n'''
          assert old in s; s = s.replace(old, new, 1)
          old = '''  php -r '$j=json_decode(file_get_contents($argv[1]),true); if(!$j || $j["coverage_status"]!==$argv[2] || $j["exit_code"]!==(int)$argv[3])exit(1);' "$TMP/reports/$name-latest-summary.json" "$coverage" "$expected"\n'''
          new = '''  local discovery_status="${5:-complete}"\n  php -r '$j=json_decode(file_get_contents($argv[1]),true); if(!$j || $j["coverage_status"]!==$argv[2] || $j["exit_code"]!==(int)$argv[3] || ($j["discovery_status"]??null)!==$argv[4])exit(1);' "$TMP/reports/$name-latest-summary.json" "$coverage" "$expected" "$discovery_status"\n'''
          assert old in s; s = s.replace(old, new, 1)
          old = '''run_case nosites 'good' 2 incomplete\nunset PW_TEST_EMPTY\n'''
          new = '''run_case nosites 'good' 2 incomplete\nunset PW_TEST_EMPTY\nexport PW_TEST_DISCOVERY_FAILED=1\nrun_case discovery 'good' 2 incomplete incomplete\nunset PW_TEST_DISCOVERY_FAILED\n'''
          assert old in s; s = s.replace(old, new, 1)
          p.write_text(s)

          # New live discovery/cache regression.
          Path('tests/discovery-reliability.sh').write_text(r'''#!/usr/bin/env bash
          set -euo pipefail
          REPO=$(cd "$(dirname "$0")/.." && pwd)
          T=$(mktemp -d "${TMPDIR:-/tmp}/presswarden-discovery.XXXXXX")
          trap 'rm -rf "$T"' EXIT
          ROOT="$T/sites"; STATE="$T/state"; CACHE="$T/cache"; mkdir -p "$ROOT/good.com/public_html" "$STATE" "$CACHE" "$T/bin"
          make_wp() {
            local p="$1"; mkdir -p "$p/wp-admin" "$p/wp-content" "$p/wp-includes"
            : > "$p/wp-load.php"; : > "$p/wp-settings.php"; printf '<?php $wp_version="7.1";\n' > "$p/wp-includes/version.php"
          }
          make_wp "$ROOT/good.com/public_html"
          cat > "$T/bin/find" <<'FIND'
          #!/usr/bin/env bash
          set -u
          marker="${PW_TEST_FIND_MARKER:-}"
          [ -z "$marker" ] || : > "$marker"
          /usr/bin/find "$@"
          rc=$?
          if [ "${PW_TEST_FAIL_DISCOVERY_FIND:-0}" = 1 ]; then
            for a in "$@"; do [ "$a" != wp-settings.php ] || exit 1; done
          fi
          exit "$rc"
          FIND
          chmod +x "$T/bin/find"

          env_common=(ROOT="$ROOT" PRESSWARDEN_SCAN_ROOT="$ROOT" PRESSWARDEN_CONFIG_FILE="$T/no-config" PRESSWARDEN_STATE_DIR="$STATE" PRESSWARDEN_CACHE_DIR="$CACHE" PRESSWARDEN_DISCOVERY_CACHE_TTL=300 PRESSWARDEN_NOCOLOR=1)

          # A traversal command that yields a valid site but exits nonzero is partial discovery, never clean.
          set +e
          out=$(env "${env_common[@]}" PATH="$T/bin:$PATH" PW_TEST_FAIL_DISCOVERY_FIND=1 bash -c '. "$1/lib/env-discovery.sh"; printf "%s|%s|%s\n" "$PW_DISCOVERY_FAILED" "${#SCAN_ROOTS[@]}" "${SCAN_ROOTS[0]:-}"' _ "$REPO" 2>&1)
          rc=$?
          set -e
          [ "$rc" -eq 0 ]; case "$out" in 1\|1\|"$ROOT/good.com/public_html"*) ;; *) printf '%s\n' "$out" >&2; exit 1 ;; esac
          [ ! -e "$CACHE/discovery.tsv" ]

          # Direct checks retain validated-site output but finish INCOMPLETE.
          cat > "$T/direct-check.sh" <<'CHECK'
          #!/usr/bin/env bash
          NAME=discovery-test; DESC='synthetic discovery verdict'; SCAN_DOES='test'; SCAN_WHY='test'
          . "$1/lib/_lib.sh"
          main() { banner; sec 'Synthetic clean section'; f=$(tmpf); : > "$f"; report "$f" info 'synthetic clean'; finish; }
          run_logged discovery-test
          CHECK
          set +e
          env "${env_common[@]}" PATH="$T/bin:$PATH" PW_TEST_FAIL_DISCOVERY_FIND=1 bash "$T/direct-check.sh" "$REPO" > "$T/direct.out" 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 2 ]; grep -q 'INCOMPLETE' "$T/direct.out"; ! grep -q '^  CLEAN' "$T/direct.out"

          # Generate a good cache first.
          env "${env_common[@]}" PRESSWARDEN_DISCOVERY_REFRESH=1 bash -c '. "$1/lib/env-discovery.sh"; [ "$PW_DISCOVERY_FAILED" -eq 0 ]; [ "${#SCAN_ROOTS[@]}" -eq 1 ]' _ "$REPO"
          [ -f "$CACHE/discovery.tsv" ]; [ ! -L "$CACHE/discovery.tsv" ]; [ "$(stat -c %a "$CACHE/discovery.tsv")" = 600 ]
          meta=$(head -n 1 "$CACHE/discovery.tsv")

          # A cache path outside ROOT must never broaden the target; it is rejected and rebuilt live.
          OUTSIDE="$T/outside.com/public_html"; make_wp "$OUTSIDE"
          { printf '%s\n' "$meta"; printf 'ROOT\t%s\nTREE\t%s\nDOMAIN\toutside.com\n' "$OUTSIDE" "$OUTSIDE"; } > "$CACHE/discovery.tsv"
          marker="$T/find-used"; rm -f "$marker"
          out=$(env "${env_common[@]}" PATH="$T/bin:$PATH" PW_TEST_FIND_MARKER="$marker" bash -c '. "$1/lib/env-discovery.sh"; printf "%s|%s\n" "$PW_DISCOVERY_FAILED" "${SCAN_ROOTS[0]:-}"' _ "$REPO")
          [ -f "$marker" ]; [ "$out" = "0|$ROOT/good.com/public_html" ]

          # Symlinked cache files are never trusted or followed.
          poison="$T/poison.tsv"; { printf '%s\n' "$meta"; printf 'ROOT\t%s\n' "$OUTSIDE"; } > "$poison"
          rm -f "$CACHE/discovery.tsv"; ln -s "$poison" "$CACHE/discovery.tsv"; marker="$T/find-used-2"; rm -f "$marker"
          out=$(env "${env_common[@]}" PATH="$T/bin:$PATH" PW_TEST_FIND_MARKER="$marker" bash -c '. "$1/lib/env-discovery.sh"; printf "%s|%s\n" "$PW_DISCOVERY_FAILED" "${SCAN_ROOTS[0]:-}"' _ "$REPO")
          [ -f "$marker" ]; [ "$out" = "0|$ROOT/good.com/public_html" ]; [ -L "$CACHE/discovery.tsv" ]

          # Oversized/corrupt caches are ignored rather than parsed into shell arrays.
          rm -f "$CACHE/discovery.tsv"; { printf '%s\n' "$meta"; head -c 4195000 /dev/zero | tr '\0' X; } > "$CACHE/discovery.tsv"
          marker="$T/find-used-3"; rm -f "$marker"
          out=$(env "${env_common[@]}" PATH="$T/bin:$PATH" PW_TEST_FIND_MARKER="$marker" bash -c '. "$1/lib/env-discovery.sh"; printf "%s|%s\n" "$PW_DISCOVERY_FAILED" "${SCAN_ROOTS[0]:-}"' _ "$REPO")
          [ -f "$marker" ]; [ "$out" = "0|$ROOT/good.com/public_html" ]

          printf 'Discovery completeness, fail-closed verdicts and cache boundary validation: PASS\n'
          ''')

          # Version/docs.
          Path('VERSION').write_text('1.1.14\n')
          p = Path('CHANGELOG.md'); s = p.read_text(); marker = 'All notable changes to PressWarden are documented here.\n\n'
          entry = '''## 1.1.14 — 2026-09-10\n\nDiscovery completeness and cache-boundary reliability.\n\n- Propagate partial WordPress discovery into direct-check and suite verdicts. Validated-site results still run and remain visible, but a traversal/discovery failure can no longer end as CLEAN or ALL CLEAR; suite JSON now includes `discovery_status`.\n- Harden discovery-cache trust: require a bounded regular non-symlink cache, reject malformed/unknown records, validate cached WordPress roots inside the selected scan root (including canonical containment when `realpath` is available), deduplicate roots, and rebuild derived labels/tree/domain data from validated paths rather than trusting cached display metadata.\n- Publish discovery cache through a private same-directory temporary file and atomic rename. Incomplete discovery is never cached, and an unsafe existing cache object is left untouched rather than followed.\n- Add regressions for traversal returning partial candidates, direct-check/suite false-clean prevention, out-of-root cache poisoning, symlinked cache files, oversized cache input, private permissions, and existing runtime behavior. No malware rules, target semantics, remediation, quarantine, baseline, or WordPress policy thresholds changed.\n\n'''
          assert marker in s; p.write_text(s.replace(marker, marker + entry, 1))
          p = Path('README.md'); s = p.read_text(); s = s.replace('version-1.1.13-2ea44f', 'version-1.1.14-2ea44f', 1)
          old = 'A finding is evidence for investigation, not automatic proof that a site is compromised.'
          new = 'A finding is evidence for investigation, not automatic proof that a site is compromised. If WordPress discovery is incomplete, validated-site findings are retained but the run is INCOMPLETE and cannot be ALL CLEAR.'
          assert old in s; p.write_text(s.replace(old, new, 1))
          PY
          chmod +x tests/discovery-reliability.sh
          git diff --check
          bash -n lib/env-discovery.sh lib/_runner.sh lib/ui.sh lib/remediation.sh tests/discovery-reliability.sh tests/runtime-reliability.sh
          php -l lib/suite-summary.php >/dev/null
          bash tests/discovery-reliability.sh
          bash tests/runtime-reliability.sh
      - name: Commit source and tests
        run: |
          git add lib/env-discovery.sh lib/_runner.sh lib/ui.sh lib/remediation.sh lib/suite-summary.php tests/discovery-reliability.sh tests/runtime-reliability.sh VERSION CHANGELOG.md README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make discovery incompleteness fail closed'
          git push origin HEAD:refs/heads/reliability/discovery-completeness-1.1.14
