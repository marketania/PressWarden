name: Stage Discovery Retry
on:
  push:
    branches: [reliability/discovery-completeness-1.1.14]
    paths: [.github/workflows/stage-discovery-retry.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/discovery-completeness-1.1.14
      - name: Apply original staged patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('.github/workflows/stage-discovery-completeness.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = textwrap.dedent(src[start:end])
          Path('/tmp/presswarden-discovery-stage.py').write_text(body + '\n')
          PY
          python3 /tmp/presswarden-discovery-stage.py
      - name: Correct suite JSON discovery field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/suite-summary.php')
          s = p.read_text()
          old = "    'run_id'=>basename($log, '.log'), 'console_log'=>$log, 'checks'=>$checks];"
          new = "    'run_id'=>basename($log, '.log'), 'console_log'=>$log,\n    'discovery_status'=>$discoveryIncomplete ? 'incomplete' : 'complete', 'checks'=>$checks];"
          assert old in s, 'suite JSON output insertion point not found'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate staged source
        run: |
          chmod +x tests/discovery-reliability.sh
          git diff --check
          bash -n lib/env-discovery.sh lib/_runner.sh lib/ui.sh lib/remediation.sh tests/discovery-reliability.sh tests/runtime-reliability.sh
          php -l lib/suite-summary.php >/dev/null
          bash tests/discovery-reliability.sh
          bash tests/runtime-reliability.sh
      - name: Commit source and tests
        run: |
          git add lib/env-discovery.sh lib/_runner.sh lib/ui.sh lib/remediation.sh lib/suite-summary.php tests/discovery-reliability.sh tests/runtime-reliability.sh VERSION CHANGELOG.md README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make discovery incompleteness fail closed'
          git push origin HEAD:refs/heads/reliability/discovery-completeness-1.1.14
