name: Stage Continuation Scope Hardening
on:
  push:
    branches: [feature/safe-continue-1.1.17]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safe-continue-1.1.17
      - name: Apply scope hardening
        run: python3 tests/.stage-continuation-scope-hardening.py
      - name: Validate continuation and shared runner
        run: |
          set -euo pipefail
          git diff --check
          bash -n lib/run-continuation.sh tests/run-continuation.sh
          php -l lib/run-continuation.php >/dev/null
          bash tests/run-continuation.sh
          bash tests/run-state.sh
          bash tests/runtime-reliability.sh
          bash tests/report-preservation.sh
      - name: PHP 7.4 compatibility
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli php -l lib/run-continuation.php >/dev/null
          docker run --rm -v "$PWD:/work" -w /work php:7.4-cli bash tests/run-continuation.sh
      - name: Commit tested hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/run-continuation.php lib/run-continuation.sh tests/run-continuation.sh
          git commit -m 'fix: validate continuation scope fingerprints and normalized depth'
          git push origin HEAD:feature/safe-continue-1.1.17
