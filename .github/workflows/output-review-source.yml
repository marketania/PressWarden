name: Output review pinned source
on:
  push:
    branches: [audit/refinement-source-20260928]
    paths: [.github/workflows/output-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressWarden
          ref: 03016f5193cc4fc63f353cec367d73f5a0c69339
          path: PressWarden
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressGarden
          ref: dadf3ca8d9156ffc226ee77d6476510379bb2bb4
          path: PressGarden
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressHarden
          ref: e6682f47a2104e07245aeb5f19fae40427a98524
          path: PressHarden
          persist-credentials: false
      - name: Export tracked files only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/press-output-review"
          mkdir "$out"
          for p in PressWarden PressGarden PressHarden; do
            git -C "$p" archive --format=tar.gz --prefix="$p/" HEAD > "$out/$p.tar.gz"
            git -C "$p" rev-parse HEAD > "$out/$p.commit"
            git -C "$p" rev-parse 'HEAD^{tree}' > "$out/$p.tree"
          done
          (cd "$out" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: press-output-review-source
          path: ${{ runner.temp }}/press-output-review/
          retention-days: 7
          if-no-files-found: error
