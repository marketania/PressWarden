name: Wire LiteSpeed DB CLI

on:
  push:
    branches: [feature/litespeed-db-maintenance]
    paths:
      - .github/workflows/patch-litespeed-cli.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/litespeed-db-maintenance

      - name: Patch PressWarden CLI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('presswarden')
          text = path.read_text()

          usage_anchor = "  ./presswarden db [target]            Database security/malware audit + maintenance\n"
          usage_insert = usage_anchor + (
              "  ./presswarden litespeed-db status [target]    Show LiteSpeed database cleanup availability\n"
              "  ./presswarden litespeed-db optimize [target]  Run LiteSpeed Cache optimize_all cleanup\n"
          )
          if usage_anchor not in text:
              raise SystemExit('usage anchor not found')
          if 'litespeed-db status [target]' not in text:
              text = text.replace(usage_anchor, usage_insert, 1)

          dispatch_anchor = '''  fast|scan|full|incident|db)\n    select_target "$@" || exit 2\n    suite="$cmd"; [ "$suite" = scan ] && suite=fast\n    exec bash "$PRESSWARDEN_DIR/suites/$suite.sh"\n    ;;\n'''
          dispatch_insert = dispatch_anchor + '''  litespeed-db)\n    action="${1:-status}"; [ "$#" -gt 0 ] && shift || true\n    case "$action" in\n      status|optimize) : ;;\n      *) printf 'Use litespeed-db status or litespeed-db optimize.\\n' >&2; exit 2 ;;\n    esac\n    [ "$#" -le 1 ] || { printf 'Usage: ./presswarden litespeed-db status|optimize [website|directory|all]\\n' >&2; exit 2; }\n    select_target "$@" || exit 2\n    exec bash "$PRESSWARDEN_DIR/checks/litespeed-db.sh" "$action"\n    ;;\n'''
          if dispatch_anchor not in text:
              raise SystemExit('dispatch anchor not found')
          if '\n  litespeed-db)\n' not in text:
              text = text.replace(dispatch_anchor, dispatch_insert, 1)

          path.write_text(text)
          PY
          bash -n presswarden checks/litespeed-db.sh tests/litespeed-db.sh
          grep -q 'litespeed-db status' presswarden
          grep -q 'checks/litespeed-db.sh' presswarden

      - name: Commit CLI wiring and remove one-time patch workflow
        shell: bash
        run: |
          git config user.name 'PressWarden automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-litespeed-cli.yml
          git add presswarden
          git commit -m 'Wire LiteSpeed database maintenance into CLI'
          git push origin HEAD:feature/litespeed-db-maintenance
