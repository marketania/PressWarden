name: Existing refinement candidate snapshots
on:
  push:
    branches: [audit/refinement-source-20260928]
    paths: [.github/workflows/refinement-candidates.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressWarden
          ref: d7867965a9b9d759568ef1a2503e394b4baa8e99
          path: WardenMain
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressWarden
          ref: 92d66c37066c338265a6325923cba39d9905aba5
          path: Warden34
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressGarden
          ref: b1a78ece9e0cef83b2721ae5dc0464f164b0b165
          path: GardenMain
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressGarden
          ref: dadf3ca8d9156ffc226ee77d6476510379bb2bb4
          path: Garden9
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressHarden
          ref: aa7817961f5cfc8b06d8beef8d7051040f059616
          path: HardenMain
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: marketania/PressHarden
          ref: 227dcddf60d8c93825cb6578cc7868c3d6398bdb
          path: Harden7
          persist-credentials: false
      - name: Export tracked source and Git identity only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refinement-candidates"
          for product in WardenMain Warden34 GardenMain Garden9 HardenMain Harden7; do
            git -C "$product" archive --format=tar.gz --prefix="$product/" HEAD > "$RUNNER_TEMP/refinement-candidates/$product.tar.gz"
            git -C "$product" rev-parse HEAD > "$RUNNER_TEMP/refinement-candidates/$product.commit"
            git -C "$product" rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/refinement-candidates/$product.tree"
          done
          cd "$RUNNER_TEMP/refinement-candidates"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: press-refinement-current-candidates
          path: ${{ runner.temp }}/refinement-candidates/
          retention-days: 7
          if-no-files-found: error
