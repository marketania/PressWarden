name: Apply reconciled maintenance
on:
  push:
    branches: [fix/litespeed-maintenance-1.1.22]
    paths: [.github/workflows/apply-reconciled-maintenance.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/litespeed-maintenance-1.1.22
          fetch-depth: 0
      - name: Reconcile exact reviewed sources and run regressions
        run: |
          set -euo pipefail
          test "$(git hash-object .reconcile-maintenance.py)" = f269aa513d3799148c67f1b39767609a885b7dc7
          python3 .reconcile-maintenance.py
          python3 -c 'from pathlib import Path; p=Path("lib/litespeed-db.sh"); p.write_text(p.read_text().rstrip()+"\n")'
          git diff --check
          php tests/db-maintenance.php
          bash tests/db-maintenance-runtime.sh
          bash tests/litespeed-db.sh
          bash tests/litespeed-full-cli.sh
          bash tests/run-continuation.sh
          bash tests/smoke.sh
          git add CHANGELOG.md README.md VERSION checks config docs lib presswarden suites tests
          git rm .reconcile-maintenance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile multisite cleanup, consent and native maintenance as 1.1.23'
          git push origin HEAD:fix/litespeed-maintenance-1.1.22
